# French — see config/packages/translation.php. Keys must match
# messages.en.yaml exactly.
email:
    anketa_created:
        subject: 'Nouveau 1:1 planifié'
        body: "%creator% a planifié un 1:1 avec vous pour le %date%.\n\nC'est ici que vous préparez tous les deux vos sujets et notez ce dont vous convenez. Vos réponses sont chiffrées de bout en bout : vous seuls, tous les deux, pouvez les lire — ni le serveur, ni les administrateurs de votre entreprise. Écrivez aussi peu que vous le souhaitez.\n\n%url%"
    meeting_rescheduled:
        subject: 'Votre 1:1 a été déplacé'
        body: "%actor% a déplacé votre 1:1 du %old_date% au %date%.\n\n%url%"
    meeting_tomorrow:
        subject: 'Votre 1:1 est demain'
        body: "Votre 1:1 avec %counterpart% est demain (%date%).\n\n%url%"
        body_not_published: "Votre 1:1 avec %counterpart% est demain (%date%).\n\nVous n'avez pas encore publié votre partie.\n\n%url%"
    meeting_monday:
        subject: 'Votre 1:1 est lundi'
        body: "Votre 1:1 avec %counterpart% est lundi (%date%).\n\n%url%"
        body_not_published: "Votre 1:1 avec %counterpart% est lundi (%date%).\n\nVous n'avez pas encore publié votre partie.\n\n%url%"
    meeting_follow_up:
        subject: "Votre 1:1 a-t-il eu lieu ?"
        body: "Votre 1:1 avec %counterpart% du %date% a-t-il eu lieu ? Il n'est pas encore clôturé.\n\nClôturer et planifier le suivant :\n%close_url%\n\nOu le déplacer à une autre date :\n%reschedule_url%"
        body_one_off: "Votre 1:1 avec %counterpart% du %date% a-t-il eu lieu ? Il n'est pas encore clôturé.\n\nClôturer ce 1:1 :\n%close_url%\n\nOu le déplacer à une autre date :\n%reschedule_url%"
    invited:
        subject: 'Vous avez été invité(e) sur encrypted1on1'
        body: "%inviter% vous a invité(e) sur encrypted1on1.\n\nActivez votre compte : %url%"
    password_reset_requested:
        subject: 'Réinitialisez votre mot de passe'
        body: "Nous avons reçu une demande de réinitialisation de votre mot de passe.\n\nChoisissez un nouveau mot de passe : %url%\n\nSi vous n'êtes pas à l'origine de cette demande, vous pouvez ignorer cet e-mail."
    counterpart_key_changed:
        subject: "La clé de chiffrement d'un interlocuteur a changé"
        body: "Le compte de %counterpart% a fait l'objet d'une réinitialisation de mot de passe, ce qui a remplacé sa clé de chiffrement.\n\nLes 1:1 que vous partagez avec cette personne devront peut-être être repartagés pour qu'elle puisse les lire — le cas échéant, vous verrez une bannière à ce sujet sur votre liste de réunions 1:1."
    signup:
        subject: 'Confirmez votre e-mail pour encrypted1on1'
        body: "Nous avons reçu une demande de création d'un compte encrypted1on1 avec cette adresse e-mail.\n\nActivez votre compte : %url%\n\nSi vous n'êtes pas à l'origine de cette demande, vous pouvez ignorer cet e-mail."
    company_signup:
        subject: 'Confirmez votre nouvelle entreprise sur encrypted1on1'
        body: "Nous avons reçu une demande de création d'une nouvelle entreprise, \"%company%\", sur encrypted1on1, avec vous comme premier administrateur.\n\nActivez votre compte : %url%\n\nSi vous n'êtes pas à l'origine de cette demande, vous pouvez ignorer cet e-mail."
    invite_renewal_requested:
        subject: "%invitee% demande une nouvelle invitation à encrypted1on1"
        body: "%invitee% a essayé d'activer son compte encrypted1on1, mais son lien d'invitation avait expiré.\n\nEnvoyez-lui une nouvelle invitation : %url%"
