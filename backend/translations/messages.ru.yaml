email:
    anketa_created:
        subject: 'Новая анкета 1-на-1'
        body: "%creator% назначил(а) с вами встречу 1-на-1 на %date%.\n\nПожалуйста, заполните свою часть: %url%"
    meeting_tomorrow:
        subject: 'Ваша встреча 1-на-1 завтра'
        body: "Ваша встреча 1-на-1 с %counterpart% состоится завтра (%date%).\n\n%url%"
    not_filled_out:
        subject: 'Напоминание: заполните анкету к завтрашней встрече'
        body: "Вы ещё не заполнили свою часть анкеты к завтрашней встрече 1-на-1 с %counterpart% (%date%).\n\n%url%"
    invited:
        subject: 'Вас пригласили в encrypted1on1'
        body: "%inviter% пригласил(а) вас в encrypted1on1.\n\nАктивируйте аккаунт: %url%"
    password_reset_requested:
        subject: 'Сброс пароля'
        body: "Мы получили запрос на сброс пароля.\n\nВыберите новый пароль: %url%\n\nЕсли вы не запрашивали это, просто проигнорируйте это письмо."
    counterpart_key_changed:
        subject: 'У собеседника изменился ключ шифрования'
        body: "Аккаунт %counterpart% прошёл через сброс пароля, из-за чего изменился его ключ шифрования.\n\nВозможно, анкеты, которые у вас с ним общие, нужно будет предоставить заново, прежде чем он сможет их прочитать — если это так, вы увидите баннер об этом в списке анкет."
    signup:
        subject: 'Подтвердите email для encrypted1on1'
        body: "Мы получили запрос на создание аккаунта encrypted1on1 с этим email.\n\nАктивируйте аккаунт: %url%\n\nЕсли вы не запрашивали это, просто проигнорируйте это письмо."
    company_signup:
        subject: 'Подтвердите новую компанию в encrypted1on1'
        body: "Мы получили запрос на создание новой компании «%company%» в encrypted1on1, где вы будете первым администратором.\n\nАктивируйте аккаунт: %url%\n\nЕсли вы не запрашивали это, просто проигнорируйте это письмо."
