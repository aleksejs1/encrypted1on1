# German — see config/packages/translation.php. Keys must match
# messages.en.yaml exactly.
email:
    anketa_created:
        subject: 'Neues 1:1 geplant'
        body: "%creator% hat ein 1:1 mit Ihnen für den %date% geplant.\n\nHier bereiten Sie beide Ihre Themen vor und halten fest, was Sie vereinbaren. Ihre Antworten sind Ende-zu-Ende-verschlüsselt: Nur Sie beide können sie lesen – weder der Server noch die Administratoren Ihres Unternehmens. Schreiben Sie so wenig, wie Sie möchten.\n\n%url%"
    meeting_rescheduled:
        subject: 'Ihr 1:1 wurde verschoben'
        body: "%actor% hat Ihr 1:1 vom %old_date% auf den %date% verschoben.\n\n%url%"
    meeting_tomorrow:
        subject: 'Ihr 1:1 ist morgen'
        body: "Ihr 1:1 mit %counterpart% ist morgen (%date%).\n\n%url%"
        body_not_published: "Ihr 1:1 mit %counterpart% ist morgen (%date%).\n\nSie haben Ihren Teil noch nicht veröffentlicht.\n\n%url%"
    meeting_monday:
        subject: 'Ihr 1:1 ist am Montag'
        body: "Ihr 1:1 mit %counterpart% ist am Montag (%date%).\n\n%url%"
        body_not_published: "Ihr 1:1 mit %counterpart% ist am Montag (%date%).\n\nSie haben Ihren Teil noch nicht veröffentlicht.\n\n%url%"
    meeting_follow_up:
        subject: "Hat Ihr 1:1 stattgefunden?"
        body: "Hat Ihr 1:1 mit %counterpart% am %date% stattgefunden? Es ist noch nicht abgeschlossen.\n\nAbschließen und das nächste planen:\n%close_url%\n\nOder auf ein anderes Datum verschieben:\n%reschedule_url%"
        body_one_off: "Hat Ihr 1:1 mit %counterpart% am %date% stattgefunden? Es ist noch nicht abgeschlossen.\n\n1:1 abschließen:\n%close_url%\n\nOder auf ein anderes Datum verschieben:\n%reschedule_url%"
    invited:
        subject: 'Sie wurden zu encrypted1on1 eingeladen'
        body: "%inviter% hat Sie zu encrypted1on1 eingeladen.\n\nAktivieren Sie Ihr Konto: %url%"
    password_reset_requested:
        subject: 'Passwort zurücksetzen'
        body: "Wir haben eine Anfrage erhalten, Ihr Passwort zurückzusetzen.\n\nWählen Sie ein neues Passwort: %url%\n\nWenn Sie dies nicht angefordert haben, können Sie diese E-Mail ignorieren."
    counterpart_key_changed:
        subject: 'Der Verschlüsselungsschlüssel eines Gegenübers hat sich geändert'
        body: "Das Konto von %counterpart% hat ein Passwort-Reset durchlaufen, wodurch sich dessen Verschlüsselungsschlüssel geändert hat.\n\n1:1s, die Sie mit dieser Person teilen, müssen möglicherweise erneut geteilt werden, damit sie diese lesen kann — falls zutreffend, sehen Sie dazu einen Hinweis in Ihrer Liste der 1:1-Meetings."
    signup:
        subject: 'Bestätigen Sie Ihre E-Mail für encrypted1on1'
        body: "Wir haben eine Anfrage erhalten, mit dieser E-Mail-Adresse ein encrypted1on1-Konto zu erstellen.\n\nAktivieren Sie Ihr Konto: %url%\n\nWenn Sie dies nicht angefordert haben, können Sie diese E-Mail ignorieren."
    company_signup:
        subject: 'Bestätigen Sie Ihr neues Unternehmen auf encrypted1on1'
        body: "Wir haben eine Anfrage erhalten, ein neues Unternehmen, \"%company%\", auf encrypted1on1 zu erstellen, mit Ihnen als dessen erstem Administrator.\n\nAktivieren Sie Ihr Konto: %url%\n\nWenn Sie dies nicht angefordert haben, können Sie diese E-Mail ignorieren."
    invite_renewal_requested:
        subject: "%invitee% bittet um eine neue Einladung zu encrypted1on1"
        body: "%invitee% wollte das encrypted1on1-Konto aktivieren, aber der Einladungslink war bereits abgelaufen.\n\nSenden Sie eine neue Einladung: %url%"
