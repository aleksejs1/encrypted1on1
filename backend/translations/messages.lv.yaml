email:
    anketa_created:
        subject: 'Ieplānota jauna 1:1 tikšanās'
        body: "%creator% ir ieplānojis(-usi) ar jums 1:1 tikšanos %date%.\n\nŠeit jūs abi sagatavojat tēmas un pierakstāt, par ko vienojaties. Jūsu atbildes ir pilnībā šifrētas: tās varat izlasīt tikai jūs abi — ne serveris, ne jūsu uzņēmuma administratori. Rakstiet tik maz, cik vēlaties.\n\n%url%"
    meeting_rescheduled:
        subject: 'Jūsu 1:1 tikšanās ir pārcelta'
        body: "%actor% pārcēla jūsu 1:1 tikšanos no %old_date% uz %date%.\n\n%url%"
    meeting_tomorrow:
        subject: 'Jūsu 1:1 tikšanās ir rīt'
        body: "Jūsu 1:1 tikšanās ar %counterpart% ir rīt (%date%).\n\n%url%"
        body_not_published: "Jūsu 1:1 tikšanās ar %counterpart% ir rīt (%date%).\n\nJūs vēl neesat publicējis(-usi) savu daļu.\n\n%url%"
    meeting_monday:
        subject: 'Jūsu 1:1 tikšanās ir pirmdien'
        body: "Jūsu 1:1 tikšanās ar %counterpart% ir pirmdien (%date%).\n\n%url%"
        body_not_published: "Jūsu 1:1 tikšanās ar %counterpart% ir pirmdien (%date%).\n\nJūs vēl neesat publicējis(-usi) savu daļu.\n\n%url%"
    meeting_follow_up:
        subject: "Vai jūsu 1:1 tikšanās notika?"
        body: "Vai jūsu 1:1 tikšanās ar %counterpart% %date% notika? Tā vēl nav slēgta.\n\nSlēgt un ieplānot nākamo:\n%close_url%\n\nVai pārcelt uz citu datumu:\n%reschedule_url%"
        body_one_off: "Vai jūsu 1:1 tikšanās ar %counterpart% %date% notika? Tā vēl nav slēgta.\n\nSlēgt tikšanos:\n%close_url%\n\nVai pārcelt uz citu datumu:\n%reschedule_url%"
    invited:
        subject: 'Jūs esat uzaicināts(-a) uz encrypted1on1'
        body: "%inviter% jūs uzaicināja pievienoties encrypted1on1.\n\nAktivizējiet savu kontu: %url%"
    password_reset_requested:
        subject: 'Paroles atiestatīšana'
        body: "Mēs saņēmām pieprasījumu atiestatīt jūsu paroli.\n\nIzvēlieties jaunu paroli: %url%\n\nJa jūs to nepieprasījāt, varat vienkārši ignorēt šo e-pastu."
    counterpart_key_changed:
        subject: 'Sarunu biedra šifrēšanas atslēga ir mainījusies'
        body: "%counterpart% konts ir veicis paroles atiestatīšanu, kas nomainīja viņa šifrēšanas atslēgu.\n\nIespējams, ka 1:1 tikšanās, kas jums ir kopīgas ar viņu, būs jāpiešķir vēlreiz, pirms viņš tās varēs izlasīt — ja tas tā ir, jūs redzēsiet par to baneri savā 1:1 tikšanos sarakstā."
    signup:
        subject: 'Apstipriniet savu e-pastu encrypted1on1'
        body: "Mēs saņēmām pieprasījumu izveidot encrypted1on1 kontu ar šo e-pasta adresi.\n\nAktivizējiet savu kontu: %url%\n\nJa jūs to nepieprasījāt, varat vienkārši ignorēt šo e-pastu."
    company_signup:
        subject: 'Apstipriniet savu jauno uzņēmumu encrypted1on1'
        body: "Mēs saņēmām pieprasījumu izveidot jaunu uzņēmumu \"%company%\" encrypted1on1, kur jūs būsiet tā pirmais administrators.\n\nAktivizējiet savu kontu: %url%\n\nJa jūs to nepieprasījāt, varat vienkārši ignorēt šo e-pastu."
    invite_renewal_requested:
        subject: "%invitee% lūdz jaunu ielūgumu uz encrypted1on1"
        body: "%invitee% mēģināja aktivizēt savu encrypted1on1 kontu, bet ielūguma saitei bija beidzies derīguma termiņš.\n\nNosūtiet jaunu ielūgumu: %url%"
