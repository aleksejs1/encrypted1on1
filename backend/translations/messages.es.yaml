email:
    anketa_created:
        subject: 'Nuevo cuestionario 1:1 programado'
        body: "%creator% ha programado una reunión 1:1 contigo para el %date%.\n\nPor favor, completa tu parte: %url%"
    meeting_tomorrow:
        subject: 'Tu reunión 1:1 es mañana'
        body: "Tu reunión 1:1 con %counterpart% es mañana (%date%).\n\n%url%"
    not_filled_out:
        subject: 'Recordatorio: completa el cuestionario antes de la reunión de mañana'
        body: "Todavía no has completado tu parte para la reunión 1:1 de mañana con %counterpart% (%date%).\n\n%url%"
    invited:
        subject: 'Te han invitado a encrypted1on1'
        body: "%inviter% te ha invitado a encrypted1on1.\n\nActiva tu cuenta: %url%"
    password_reset_requested:
        subject: 'Restablece tu contraseña'
        body: "Hemos recibido una solicitud para restablecer tu contraseña.\n\nElige una nueva contraseña: %url%\n\nSi no solicitaste esto, puedes ignorar este correo."
    counterpart_key_changed:
        subject: 'La clave de cifrado de un interlocutor ha cambiado'
        body: "La cuenta de %counterpart% pasó por un restablecimiento de contraseña, lo que reemplazó su clave de cifrado.\n\nEs posible que los cuestionarios que compartes con esa persona deban compartirse de nuevo antes de que pueda leerlos — si es así, verás un aviso al respecto en tu lista de cuestionarios."
    signup:
        subject: 'Confirma tu email para encrypted1on1'
        body: "Hemos recibido una solicitud para crear una cuenta de encrypted1on1 con esta dirección de correo.\n\nActiva tu cuenta: %url%\n\nSi no solicitaste esto, puedes ignorar este correo."
    company_signup:
        subject: 'Confirma tu nueva empresa en encrypted1on1'
        body: "Hemos recibido una solicitud para crear una nueva empresa, \"%company%\", en encrypted1on1, contigo como su primer administrador.\n\nActiva tu cuenta: %url%\n\nSi no solicitaste esto, puedes ignorar este correo."
