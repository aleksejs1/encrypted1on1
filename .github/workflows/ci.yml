name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite
          coverage: pcov

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Validate Doctrine mapping
        run: composer schema-validate

      - name: Run test suite with coverage
        run: composer test-coverage

      - name: Run static analysis
        run: composer stan

      - name: Check code style
        run: composer cs

      - name: Check code complexity
        run: composer md

      - name: Audit dependencies for known vulnerabilities
        run: composer audit

  # Mutation testing (infection/infection), scoped to just this PR's own changed lines
  # (--git-diff-lines) — see private/delivery-quality-improvement-proposal.md's Phase 6
  # write-up for the full reasoning. Report-only for now, not a merge gate: no
  # --min-msi/--min-covered-msi threshold is set, so this job always exits 0 regardless
  # of what it finds (--logger-github still surfaces escaped mutants as inline PR
  # annotations) — confirmed for real, not assumed, that a hard 90% covered-MSI floor
  # (the proposal's own original suggestion) would fail on already-accepted, already-
  # shipped patterns this codebase has no test for today (AuthSession::closeForReading()
  # calls score 85% covered MSI on their own small diff — see AuthController::me()'s
  # identical, pre-existing, untested call). Blocking CI on an uncalibrated threshold
  # would just train everyone to ignore red CI, the same reasoning the frontend job's own
  # `npm audit` exemption above already documents; revisit once a handful of real PRs
  # have produced enough MSI data to pick a floor that isn't itself a guess.
  #
  # `make mutation-backend` runs the same tool locally, but without the diff scoping —
  # `docker-compose.dev.yml`'s `./backend:/app` bind mount never exposes the repo's own
  # `.git` directory to that container, so Infection has no history to diff against from
  # in there; only this native CI job (full checkout, real git) can do the scoped version.
  mutation:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          # Needs the PR's base commit reachable in history to diff against it — the
          # default shallow (depth-1) checkout only has the merge commit itself.
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite
          coverage: pcov

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      # Own cache key (composer-mutation, not composer/composer-e2e) — same reasoning as
      # the e2e job's own cache key comment below: this job runs in parallel with
      # `backend`, which caches the identical path from the identical composer.lock, and
      # two parallel jobs racing to save the same key means GitHub Actions silently drops
      # the loser's save.
      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-mutation-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-mutation-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Prepare test database
        run: composer test-db-reset

      # --initial-tests-php-options mirrors backend/composer.json's own "mutation"
      # script — Infection always runs a full initial PHPUnit pass to generate its own
      # coverage first, and that pass has hit PHP's default memory_limit in this
      # backend's own dev container before (EnforceEncryptedEntityFieldsRuleTest, a
      # PHPStan RuleTestCase run inside PHPUnit). shivammathur/setup-php's runner
      # default is far more generous, so this is likely a no-op here — kept anyway so
      # this job can't fail on a memory ceiling `make mutation-backend` doesn't have.
      - name: Run mutation testing on the PR diff
        run: >
          vendor/bin/infection --threads=4 --no-progress --logger-github
          --initial-tests-php-options="-d memory_limit=512M"
          --git-diff-lines --git-diff-base=${{ github.event.pull_request.base.sha }}

  # Repo-wide checks that don't fit the backend/frontend split: duplication spans both
  # backend/src and frontend/src in one pass (jscpd natively tokenizes both PHP and
  # TS/Svelte), and the doc-link check covers root *.md + docs/** either way.
  repo-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check for duplicated code
        run: npm run duplication

      - name: Check internal doc links
        run: npm run check-doc-links

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format

      - name: Check for unused files/exports/dependencies
        run: npm run knip

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # --audit-level=high, not the default (any severity): svelte-i18n@4.0.1 (the latest
      # published version) depends on an old esbuild with a known moderate advisory
      # (GHSA-67mh-4wv8-2f99) that only affects esbuild's own local dev server accepting
      # cross-origin requests — irrelevant to the built production bundle this app ships,
      # and there's currently no upstream fix (confirmed: `npm audit fix --force` only
      # offers a breaking downgrade to svelte-i18n@3.7.1, not a real fix). Blocking CI on
      # an unfixable, inapplicable finding would just train everyone to ignore red CI, so
      # this gate blocks on high/critical (a real, actionable class of finding) and
      # accepts this one specific moderate issue until svelte-i18n bumps esbuild upstream.
      - name: Audit dependencies for known vulnerabilities
        run: npm audit --audit-level=high

  # The dual-actor Playwright suite (frontend/e2e/) against the genuinely isolated
  # e2e stack (docker-compose.e2e.yml) — the same commands `make e2e` runs locally,
  # not a parallel CI-only setup. Chromium only (playwright.config.ts has no
  # `projects` array, so Playwright's default single project already covers what
  # this repo tests) — no FrankenPHP/tmpfs/Argon2id-profile changes needed here:
  # docker/dev/backend.Dockerfile is already dunglas/frankenphp-based, not `php -S`,
  # and the frontend already defaults to libsodium's fastest 'interactive' Argon2id
  # profile with no e2e-specific override — both already true before this job
  # existed, confirmed by actually running the suite (14.7s, 5/5 passing) rather
  # than assumed from the proposal that first floated this job
  # (private/delivery-quality-improvement-proposal.md, not tracked in git).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      # Safe to run unconditionally even on a cache hit: playwright install skips
      # re-downloading a browser it finds already in ~/.cache/ms-playwright, but the
      # OS-level shared libraries --with-deps installs via apt aren't part of that
      # cached path and don't persist across a fresh runner VM either way.
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite

      - name: Get composer cache directory
        id: composer-cache
        working-directory: backend
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      # Own cache key (composer-e2e, not composer): the `backend` job caches the same
      # path from the same composer.lock — sharing one key would have both jobs race
      # to save it (they run in parallel, no `needs:` between them), and GitHub
      # Actions silently drops the losing job's save rather than erroring.
      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-e2e-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-e2e-

      # Needed on the *runner's* filesystem, not just inside the image build:
      # docker-compose.e2e.yml bind-mounts ./backend:/app, which shadows whatever
      # backend.Dockerfile's own `RUN composer install` baked into the image at
      # container start — confirmed by actually building the image and reproducing
      # the same bind mount. Without this, /app/vendor is empty inside the running
      # container on a fresh checkout (backend/vendor is gitignored), and the very
      # next step's migrate command fatals on a missing vendor/autoload.php.
      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-progress --prefer-dist

      # Blocks until the backend's healthcheck passes (docker-compose.e2e.yml,
      # `up --wait`), not just until the container process started — the same
      # guarantee `make e2e` already gives a local run, not a CI-only addition.
      #
      # Known, deliberately undone cost: `--build` here reruns backend.Dockerfile's
      # own `apt-get`/`composer install`/`dump-autoload` from scratch every run, with
      # no Docker layer cache — and that work is immediately thrown away anyway, since
      # the bind mount above shadows the image's vendor/ with the runner's own (the
      # "Install backend dependencies" step). Fixing this properly means changing
      # backend.Dockerfile/docker-compose.*.yml's shared bind-mount pattern, which
      # also affects local dev — a separate, bigger change than wiring e2e into CI,
      # left alone here rather than expanded into unrelated scope.
      - name: Start the e2e stack
        run: make e2e-up

      - name: Run e2e tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down the e2e stack
        if: always()
        run: make e2e-down

  # Exercises docker/prod/backup.sh and docker/prod/restore.sh for real — not just
  # reviewing them by eye — against a real throwaway prod image and real seeded demo
  # data (see scripts/test-backup-restore.sh's own header comment for the full
  # walkthrough: build, seed, back up, destroy the live database, restore, and confirm
  # the restored data is byte-identical to a fresh backup of it). Self-contained (its
  # own Compose project, its own throwaway .env.prod, no ports/state shared with the
  # `e2e` job's stack), so it needs nothing beyond Docker, already present on the
  # runner — no Node/PHP setup step, unlike every other job here.
  backup-restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test backup/restore round-trip
        run: ./scripts/test-backup-restore.sh
