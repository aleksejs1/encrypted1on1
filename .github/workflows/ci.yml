name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run test suite
        run: composer test

      - name: Run static analysis
        run: composer stan

      - name: Audit dependencies for known vulnerabilities
        run: composer audit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      # --audit-level=high, not the default (any severity): svelte-i18n@4.0.1 (the latest
      # published version) depends on an old esbuild with a known moderate advisory
      # (GHSA-67mh-4wv8-2f99) that only affects esbuild's own local dev server accepting
      # cross-origin requests — irrelevant to the built production bundle this app ships,
      # and there's currently no upstream fix (confirmed: `npm audit fix --force` only
      # offers a breaking downgrade to svelte-i18n@3.7.1, not a real fix). Blocking CI on
      # an unfixable, inapplicable finding would just train everyone to ignore red CI, so
      # this gate blocks on high/critical (a real, actionable class of finding) and
      # accepts this one specific moderate issue until svelte-i18n bumps esbuild upstream.
      - name: Audit dependencies for known vulnerabilities
        run: npm audit --audit-level=high
