# Alternate to docker-compose.prod.yml, for hosts where an existing reverse
# proxy (e.g. a host-level nginx already serving other projects on 80/443)
# owns those ports. See README.md's "Production, behind an existing reverse
# proxy" section for the full setup (host nginx config, etc).
#
# Standalone, not layered on top of docker-compose.prod.yml via `-f a -f b`
# — Compose's merge behavior for list-valued keys like `ports` differs by
# key (replace vs. concatenate) in ways that would be easy to get subtly
# wrong here, so this is a complete, independently-readable file instead.
# Same image (docker/prod/app.Dockerfile) as the direct-facing file — no
# rebuild needed to switch topologies, just a different Compose file and a
# different bind-mounted Caddyfile.
services:
  app:
    build:
      context: .
      dockerfile: docker/prod/app.Dockerfile
      args:
        # Baked into the static bundle at build time — see docs/deployment.md's
        # "Frontend build-time" section. Pick once, before any real user
        # registers; changing it later on a running instance locks every
        # existing account out irrecoverably.
        ARGON2ID_PROFILE: "${ARGON2ID_PROFILE:-interactive}"
        # Baked into the static bundle at build time too — see docs/deployment.md's
        # "Frontend build-time" section. Empty by default: no footer link until
        # an operator opts in.
        PRIVACY_POLICY_URL: "${PRIVACY_POLICY_URL:-}"
        # Shows a "Try the live demo" login button — see docs/deployment.md's
        # "Frontend build-time" section. Off by default.
        DEMO_MODE: "${DEMO_MODE:-false}"
        # Short commit hash baked into the footer's version display —
        # computed automatically by docker/prod/deploy.sh, not meant to be
        # hand-set. See docs/deployment.md's "Frontend build-time" section.
        GIT_SHA: "${GIT_SHA:-}"
        # Shows the version/commit hash in the footer — see
        # docs/deployment.md's "Frontend build-time" section. Off by default.
        SHOW_VERSION: "${SHOW_VERSION:-false}"
    ports:
      # Caddy only ever listens on port 80 in this mode (auto_https is off
      # in Caddyfile.reverse-proxy, so there's nothing on 443 to publish).
      # Bind to localhost, not 0.0.0.0 — this port is an implementation
      # detail of the reverse-proxy handoff, not meant to be reachable
      # directly from outside the host.
      - "${APP_INTERNAL_BIND:?e.g. 127.0.0.1:8090 — set in .env.prod, must match your reverse proxy's upstream/proxy_pass target}:80"
    volumes:
      - data:/app/var
      # auto_https is off in this mode, so Caddy never provisions its own
      # certificates here — added anyway for symmetry with the direct-facing
      # file, in case that ever changes; it just stays empty otherwise.
      - caddy_data:/data
      - caddy_config:/config
      - ./docker/prod/Caddyfile.reverse-proxy:/etc/frankenphp/Caddyfile:ro
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      # Display/log-only — confirmed PHP's own date_default_timezone_get()
      # stays UTC regardless (this app's date math, e.g. SendRemindersCommand,
      # already hardcodes UTC explicitly and doesn't read this). Only affects
      # what timezone container-level tools (the `date` command, log
      # timestamps if you inspect them directly) display in.
      TZ: "${TZ:-UTC}"
      APP_SECRET: "${APP_SECRET:?generate one with 'openssl rand -hex 32'}"
      DATABASE_URL: "sqlite:///%kernel.project_dir%/var/data.db"
      SERVER_NAME: "${SERVER_NAME:?set a real public domain, e.g. 1on1.example.com}"
      FRONTEND_URL: "${FRONTEND_URL:?e.g. https://1on1.example.com, same domain as SERVER_NAME, used to build links in emails}"
      MAILER_DSN: "${MAILER_DSN:?set a real SMTP DSN, e.g. smtp://user:pass@smtp.example.com:587}"
      MAILER_FROM: "${MAILER_FROM:?e.g. noreply@1on1.example.com}"
      # Told to Symfony (backend/config/packages/framework.php) so it trusts
      # X-Forwarded-* from the reverse proxy — without this, session cookies
      # would lose their Secure flag even on real HTTPS traffic, since Caddy
      # only ever sees the internal plain-HTTP hop from the proxy. Defaults
      # assume the reverse proxy runs on the same host (loopback) — widen
      # this if it's elsewhere (a different container, a separate host).
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-127.0.0.1,::1}"
      # Same trust decision, told to Caddy itself (docker/prod/Caddyfile.reverse-proxy)
      # — Caddy also needs to trust the proxy's X-Forwarded-* before it will
      # relay them onward, independently of the Symfony-level setting above.
      CADDY_TRUSTED_PROXIES: "${CADDY_TRUSTED_PROXIES:-127.0.0.1 ::1}"
      SENTRY_DSN: "${SENTRY_DSN:-}"
    restart: unless-stopped

volumes:
  data:
  caddy_data:
  caddy_config:
